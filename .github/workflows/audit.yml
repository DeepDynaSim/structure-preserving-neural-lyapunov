name: Numerical export audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mathematical-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npx --yes pnpm@11.25.0 install --dir tools/math-renderer --frozen-lockfile --ignore-scripts
      - run: node scripts/render_math.mjs --check
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_exports.py --output generated/python_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: numerical-audit
          path: generated/python_audit.json
